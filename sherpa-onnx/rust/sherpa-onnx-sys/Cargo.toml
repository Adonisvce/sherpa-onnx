[package]
name = "sherpa-onnx-sys"
version = "1.13.8"
edition = "2021"
description = "Raw FFI bindings to the sherpa-onnx C API"
license = "Apache-2.0"
repository = "https://github.com/k2-fsa/sherpa-onnx"
readme = "README.md"
links = "sherpa-onnx"

keywords = ["ffi", "speech", "sherpa-onnx", "bindings"]
categories = ["external-ffi-bindings"]

include = [
    "src/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[features]
default = ["static"]
static = []
shared = []

[build-dependencies]
bzip2 = "0.4"
tar = "0.4"
ureq = { version = "2.12", features = ["proxy-from-env"] }
# zip 9 is the first line that carries the extraction advisories (GHSA-m665-v7pm-7grj,
# GHSA-q7v9-x93c-xqv3, GHSA-8hxf-qr8p-62x4); no 2.x backport exists. Same bump as upstream v2.0.1.
zip = "9"

[package.metadata.docs.rs]
default-features = false
features = []
